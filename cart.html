<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keranjang - eKantin</title>

    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="app-nav.css">
</head>

<body>

    <!-- HEADER -->
    <header class="cart-header">

        <button class="back-button" onclick="goBack()">
            ←
        </button>

        <div>
            <h1>Keranjang</h1>
            <p>Pesanan makananmu</p>
        </div>

    </header>


    <!-- ISI KERANJANG -->
    <main class="cart-container">

        <div id="cartItems">
            <!-- Item keranjang akan muncul melalui JavaScript -->
        </div>


        <!-- KOSONG -->
        <div id="emptyCart" class="empty-cart">

            <div class="empty-icon">
                🛒
            </div>

            <h2>Keranjang masih kosong</h2>

            <p>
                Yuk pilih makanan sehat favoritmu.
            </p>

            <button onclick="goToMenu()">
                Lihat Menu
            </button>

        </div>


        <!-- RINGKASAN -->
        <section id="cartSummary" class="cart-summary">

            <div class="summary-row">
                <span>Jumlah Item</span>
                <strong id="totalItems">0</strong>
            </div>

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subtotal">Rp0</strong>
            </div>

            <div class="summary-line"></div>

            <div class="summary-total">
                <span>Total</span>
                <strong id="totalPrice">Rp0</strong>
            </div>

            <button class="checkout-button" onclick="checkout()">
                Lanjut Checkout
            </button>

        </section>

    </main>


    <nav class="app-bottom-nav" aria-label="Navigasi utama">
        <a class="app-nav-item" href="dashboard.html"><span>🏠</span><small>Beranda</small></a>
        <a class="app-nav-item active" href="menu.html"><span>🍱</span><small>Menu</small></a>
        <a class="app-nav-item" href="history.html"><span>📋</span><small>Riwayat</small></a>
        <a class="app-nav-item" href="nutrition.html"><span>🥗</span><small>Gizi</small></a>
        <a class="app-nav-item" href="akun.html"><span>👤</span><small>Profil</small></a>
    </nav>

    <script src="api-config.js"></script>
    <script src="cart.js"></script>

</body>
</html>
